name: Image

# Builds the ARM64 container image for the Kubernetes cluster (Oracle Ampere nodes)
# and pushes it to GHCR as ghcr.io/<owner>/deal-hub-backend:<commit sha>.
# This runs alongside the Kamal deploy and does not change it.
on:
  push:
    branches: [ main, k8s-image ]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Native ARM runner: no emulation, so gems with C extensions compile at full speed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
